name: Build and publish a verifiable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated v<version> tag to publish (for example, v9.1.0.1)"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, checksum, attest, and publish
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      RELEASE_EVENT_NAME: ${{ github.event_name }}
      RELEASE_EVENT_SHA: ${{ github.sha }}
      RELEASE_EVENT_REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Check out the release tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Confirm annotated tag, package version, and source commit
        id: metadata
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "::error::Release tag must use the four-part v<version> format."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          TAG_REF="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$TAG_REF")" = "tag"
          TAG_COMMIT="$(git rev-parse --verify "$TAG_REF^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          test "$TAG_COMMIT" = "$CHECKED_OUT_COMMIT"
          if [[ "$RELEASE_EVENT_NAME" == "push" || "$RELEASE_EVENT_REF_TYPE" == "tag" ]]; then
            test "$TAG_COMMIT" = "$RELEASE_EVENT_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Install locked root dependencies
        run: npm ci
      - name: Run release checks
        run: |
          npm run lint
          npm run check:build
          npm audit --audit-level=moderate
      - name: Build a reproducible source/PWA bundle and SHA-256 checksum
        id: package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          ASSET="index-engine-v${VERSION}.zip"
          STAGING="$(mktemp -d)"
          PACKAGE_ROOT="Index-Engine-v${VERSION}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          mkdir -p "$STAGING/$PACKAGE_ROOT/docs" "$STAGING/$PACKAGE_ROOT/tools" dist
          cp -R v9 "$STAGING/$PACKAGE_ROOT/v9"
          cp tools/terminal-engine.html "$STAGING/$PACKAGE_ROOT/tools/terminal-engine.html"
          cp README.md LICENSE "$STAGING/$PACKAGE_ROOT/"
          cp docs/GUIDE-SPA.md docs/SPEC-AUDIT.md "$STAGING/$PACKAGE_ROOT/docs/"
          find "$STAGING/$PACKAGE_ROOT" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          (
            cd "$STAGING"
            find "$PACKAGE_ROOT" -print | LC_ALL=C sort | TZ=UTC zip -X -q -@ "$GITHUB_WORKSPACE/dist/$ASSET"
          )
          (
            cd dist
            sha256sum "$ASSET" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Attest the release archive's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.asset }}
      - name: Publish GitHub Release with archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/$ASSET" \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Index Engine $VERSION" \
            --generate-notes
