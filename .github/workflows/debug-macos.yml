name: Debug macOS build

on:
  push:
    branches:
      - arena/07fe4a90-index-engine-v6-2

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Build and report the failure log
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Sync the V9 bundle
        run: npm run macos:sync
      - name: Build
        id: build
        run: |
          set -uo pipefail
          npm run macos:build > /tmp/macos-build.log 2>&1
          echo "exit_status=$?" >> "$GITHUB_OUTPUT"
          echo "::group::build log"
          cat /tmp/macos-build.log
          echo "::endgroup::"
      - name: Report to the session PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_STATUS: ${{ steps.build.outputs.exit_status }}
        run: |
          set -euo pipefail
          PR="$(gh pr list --head arena/07fe4a90-index-engine-v6-2 --state open --json number --jq '.[0].number')"
          {
            echo "### macOS build diagnosis — \`${GITHUB_SHA::7}\`"
            echo
            echo "exit status: \`${EXIT_STATUS}\`"
            echo
            echo '```'
            tail -n 300 /tmp/macos-build.log
            echo '```'
          } > /tmp/report.md
          gh pr comment "$PR" --body-file /tmp/report.md
